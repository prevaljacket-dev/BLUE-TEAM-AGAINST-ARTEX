title: ARTEX - User-Agent d'evaluation ARTEX-Assessment
id: 3f6c1a52-8e1d-4c7b-9b8a-a1e0c0de0001
status: experimental
description: Requete portant l'identifiant optionnel qu'ARTEX ajoute quand une tache a l'identification d'evaluation activee.
references:
  - https://github.com/BaaRai/ARTEX
author: ARTEX blue team
date: 2026-11-24
tags:
  - attack.reconnaissance
  - attack.t1595
logsource:
  category: webserver
detection:
  selection:
    cs-user-agent|startswith: 'ARTEX-Assessment/'
  condition: selection
falsepositives:
  - Pentest autorise et annonce (verifier la reference engagement=... dans l'UA)
level: high
