title: ARTEX - Tentative de LFI ou de traversee de repertoire
id: 3f6c1a52-8e1d-4c7b-9b8a-a1e0c0de0004
status: experimental
description: Charges LFI classiques testees par les workers ARTEX (nuclei, ffuf, tests manuels) avant la chaine php2shell.
author: ARTEX blue team
date: 2026-11-24
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
      - '../../../'
      - '..%2f..%2f'
      - '%2e%2e%2f%2e%2e%2f'
      - '/etc/passwd'
      - 'php://filter'
      - 'php://input'
      - 'data://text/plain'
      - 'expect://'
  condition: selection
falsepositives:
  - Scanners de vulnerabilites autorises
level: high
