title: ARTEX - Sondes SQLi et XSS automatisees (sqlmap, dalfox, nuclei)
id: 3f6c1a52-8e1d-4c7b-9b8a-a1e0c0de0005
status: experimental
description: Motifs de charges SQLi/XSS generes par les outils d'ARTEX.
author: ARTEX blue team
date: 2026-11-24
tags:
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
detection:
  selection_sqli:
    cs-uri-query|contains:
      - 'UNION ALL SELECT'
      - 'UNION%20ALL%20SELECT'
      - 'SLEEP(5)'
      - 'SLEEP%285%29'
      - 'WAITFOR DELAY'
      - 'AND 1=1'
      - 'extractvalue('
      - 'updatexml('
  selection_xss:
    cs-uri-query|contains:
      - '<script>'
      - '%3Cscript%3E'
      - 'onerror='
      - 'onload=alert'
      - 'javascript:alert'
      - '<svg'
      - '%3Csvg'
  condition: 1 of selection_*
falsepositives:
  - Scanners autorises, WAF tests
level: medium
