name: Sentinel

on:
  push:
    paths: ["sentinel/**", "samples/**", ".github/workflows/sentinel.yml"]
  pull_request:
    paths: ["sentinel/**", "samples/**", ".github/workflows/sentinel.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 sentinel/tests/test_sentinel.py
