name: soar-tests
on:
  push:
    paths: ["soar/**", "tools/**", ".github/workflows/soar-tests.yml"]
  pull_request:
    paths: ["soar/**", "tools/**", ".github/workflows/soar-tests.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m artex_soar replay ../samples/access_demo.log --target web01 || test $? -eq 2
