# Cible de labo. Deux leviers pilotes par ARTEX SOAR via le volume /lab-control (lecture seule ici) :
#  - blocked.txt  : RewriteMap ecrite par le connecteur "blocklist_file" (format rewritemap).
#                   Apache la relit des qu'elle change : le blocage est immediat, sans redemarrage.
#  - quarantine   : fichier cree par le connecteur d'isolation -> le serveur ne repond plus (503).
<VirtualHost *:80>
    ServerName lab-target
    DocumentRoot /var/www/html
    CustomLog /lab-logs/access.log combined
    ErrorLog /proc/self/fd/2

    ErrorDocument 403 "403 - Adresse bloquee par ARTEX SOAR (labo)"
    ErrorDocument 503 "503 - Serveur isole par ARTEX SOAR (labo)"

    RewriteEngine On
    RewriteMap blocked "txt:/lab-control/blocked.txt"
    RewriteCond /lab-control/quarantine -f
    RewriteRule ^ - [R=503,L]
    RewriteCond ${blocked:%{REMOTE_ADDR}|ok} !=ok
    RewriteRule ^ - [F,L]
</VirtualHost>
